[project]
name = "knowledge-assistant"
version = "0.1.0"
description = "AI-бекенд: користувачі завантажують документи й ставлять питання, відповідь з цитатами"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5,<6",  # arq 0.28 не сумісний з redis 6+
    "pyjwt>=2.8",
    "arq>=0.26",
    "boto3>=1.34",
    "pypdf>=4.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "fakeredis>=2.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle і pyflakes, I: сортування імпортів, B: bugbear, UP: сучасний синтаксис,
# S: bandit-правила (безпека), SIM: спрощення
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]  # assert, тестові паролі, довгі рядки SQL
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "arq", "arq.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: потребує PostgreSQL (KA_TEST_DATABASE_URL), у звичайному запуску пропускається"]
