name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ka
          POSTGRES_PASSWORD: ka-ci-only
          POSTGRES_DB: ka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ka -d ka" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      minio:   # лише для тестів; офіційні образи MinIO більше не в Docker Hub
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: ka-dev
          MINIO_ROOT_PASSWORD: ka-dev-only-secret
        ports: ["9000:9000"]
    env:
      KA_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      KA_TEST_DATABASE_URL: postgresql+psycopg://ka:ka-ci-only@127.0.0.1:5432/ka
      KA_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      # у M7 закріпи дії на sha (завдання №73 у SkillBoost)
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -U pip && pip install -e ".[dev]"
      - run: pip-audit --skip-editable   # відомі вразливості залежностей
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app tests
      - run: pytest -q
